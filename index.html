<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NASA Space Explorer</title>
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>
<body>
  <div class="container">
    <header class="site-header">
      <img src="img/nasa-worm-logo.png" alt="NASA Logo" class="logo" />
      <h1>Space Explorer</h1>
    </header>

    <!-- LevelUp: Random Space Fact Banner -->
    <div class="space-fact-card" id="factCard">
      <div class="fact-badge">🚀 DID YOU KNOW?</div>
      <p id="factText">Loading cosmic fact...</p>
    </div>

    <!-- Filter Inputs -->
    <div class="filters">
      <div class="input-group">
        <label for="startDate">Start Date</label>
        <input type="date" id="startDate" />
      </div>
      <div class="input-group">
        <label for="endDate">End Date</label>
        <input type="date" id="endDate" />
      </div>
      <button id="getImagesBtn">Get Space Images</button>
    </div>

    <!-- Gallery Container -->
    <div id="gallery" class="gallery">
      <div class="placeholder">
        <div class="placeholder-icon">🔭</div>
        <p>Select a date range and click "Get Space Images" to explore the cosmos!</p>
      </div>
    </div>
  </div>

  <!-- Modal View Window -->
  <div id="mediaModal" class="modal hidden" aria-hidden="true">
    <div class="modal-overlay" id="modalOverlay"></div>
    <div class="modal-content">
      <button class="modal-close" id="modalClose" aria-label="Close modal">&times;</button>
      <div id="modalMedia" class="modal-media"></div>
      <div class="modal-body">
        <h2 id="modalTitle" class="modal-title"></h2>
        <span id="modalDate" class="modal-date"></span>
        <p id="modalExplanation" class="modal-explanation"></p>
      </div>
    </div>
  </div>

  <script src="js/dateRange.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
