<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>NASA APOD Space Explorer</title>
  <!-- Load stylesheet from root or css directory -->
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-container">
    
    <!-- Header -->
    <header class="header">
      <div class="logo-title-container">
        <span class="nasa-logo-text">NASA</span>
        <h1>SPACE EXPLORER</h1>
      </div>
    </header>

    <!-- Fact Banner -->
    <div class="fact-banner">
      <span class="fact-label">🚀 DID YOU KNOW?</span>
      <p id="factText">Loading space fact...</p>
    </div>

    <!-- Main Content Panel -->
    <main class="main-content">
      <form class="controls-panel" onsubmit="return false;">
        <div class="date-input-group">
          <label for="startDate">START DATE</label>
          <input type="date" id="startDate" required>
        </div>
        <div class="date-input-group">
          <label for="endDate">END DATE</label>
          <input type="date" id="endDate" required>
        </div>
        <button id="getImagesBtn" type="button">GET SPACE IMAGES</button>
      </form>

      <!-- Gallery Grid -->
      <div id="gallery" class="gallery-grid"></div>
    </main>

    <!-- Detailed Media Modal -->
    <div id="mediaModal" class="modal hidden" aria-hidden="true">
      <div id="modalOverlay" class="modal-overlay"></div>
      <div class="modal-content">
        <button id="modalClose" class="modal-close" aria-label="Close modal">&times;</button>
        <div id="modalMedia" class="modal-media"></div>
        <div class="modal-details">
          <h2 id="modalTitle"></h2>
          <p id="modalDate" class="modal-date"></p>
          <p id="modalExplanation" class="modal-explanation"></p>
        </div>
      </div>
    </div>

  </div>

  <!-- Scripts -->
  <script src="dateRange.js"></script>
  <script src="js/dateRange.js"></script>
  <script src="script.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
